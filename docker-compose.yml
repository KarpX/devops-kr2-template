services:
  app:
    build: .
    image: kr2-app:1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STUDENT=<Фамилия>
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:

networks:
  backend:
    internal: false
